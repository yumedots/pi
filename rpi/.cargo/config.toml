# The port's build is capped, because an uncapped build takes this machine down.
#
# Cargo's default is one rustc per core, and this machine has 11 cores, so an
# uncapped build runs 11 compiler processes at once. That pins the CPU for
# over a minute, and macOS's kernel watchdog panics the whole system when it
# cannot check in:
#
#   panic(cpu 0 caller 0xfffffe003ca63250): watchdog timeout:
#   no checkins from watchdogd in 94 seconds
#
# One job is the safe setting: a single compiler process, so the build can
# never saturate the machine no matter how many builds are queued behind
# cargo's target-directory lock. The build is slower than it could be, and the
# machine stays usable, which is the trade that matters here.
[build]
jobs = 1

# The nightly cargo's cache garbage collection (-Z gc) removes the artifacts the
# machine has not used for a while. The default window is a month, which is
# longer than the disk on this machine can afford: the target directory
# reaches fifteen gigabytes with two builds' worth of artifacts in it.
[gc]
auto = true
max_age = "3 days"
