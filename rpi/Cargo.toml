# rpi — a Rust agent runtime + CLI. See README.md and docs/architecture/overview.md.
[workspace]
members = [
    "crates/rpi-ai",
    "crates/rpi-agent",
    "crates/rpi-tools",
    "crates/rpi-mcp",
    "crates/rpi-harness",
    "crates/rpi-cli",
    "crates/rpi-tui",
    "crates/rpi-js",
    "crates/rpi-plugin-sdk",
    "crates/rpi-extensions",
    "examples/minimal",
    "examples/tools",
    "examples/tui",
    "examples/plugin-stub",
]
default-members = [
    "crates/rpi-agent",
    "crates/rpi-tools",
    "crates/rpi-harness",
    "crates/rpi-cli",
]
resolver = "2"

[workspace.package]
edition = "2021"
rust-version = "1.78"
license = "MIT"
repository = "https://github.com/bigfish1913/pi-rust"
homepage = "https://rpi.laofu.online/"
version = "0.6.3"
authors = ["BigFish <fuwei201473@gmail.com>"]

[workspace.dependencies]
# Async runtime
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "fs", "process", "sync", "io-util"] }
tokio-util = { version = "0.7", features = ["rt"] }
async-trait = "0.1"
futures = "0.3"
fs2 = "0.4"

# Serialization / schemas
serde = { version = "1", features = ["derive", "rc"] }
serde_json = { version = "1", features = ["preserve_order", "raw_value"] }
yaml_serde = "=0.10.2"
indexmap = { version = "2", features = ["serde"] }
schemars = { version = "0.8", features = ["preserve_order"] }
jsonschema = "0.18"

# HTTP / SSE (used by anthropic provider, M3)
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream"] }
bytes = "1"
eventsource-stream = "0.2"

# Errors / logging
thiserror = "1"
tracing = "0.1"

# Misc
uuid = { version = "1", features = ["v4", "v7"] }
rusqlite = { version = "0.31", features = ["bundled"] }
base64 = "0.22"
png = "0.18"
tempfile = "3"
regex = "1"
semver = "1"
globset = "=0.4.15"
dirs = "5"
rpassword = "7"

# rpi internal crates (package names and directories both use the `rpi-` prefix).
rpi-ai = { path = "crates/rpi-ai", version = "0.6.3" }
rpi-agent = { path = "crates/rpi-agent", version = "0.6.3" }
rpi-tools = { path = "crates/rpi-tools", version = "0.6.3" }
rpi-mcp = { path = "crates/rpi-mcp", version = "0.6.3" }
rpi-harness = { path = "crates/rpi-harness", version = "0.6.3" }

rpi-tui = { path = "crates/rpi-tui", version = "0.6.3" }

rpi-plugin-sdk = { path = "crates/rpi-plugin-sdk", version = "0.6.3" }
rpi-extensions = { path = "crates/rpi-extensions", version = "0.6.3" }
rpi-js = { path = "crates/rpi-js", version = "0.6.3" }

# The dev build's footprint is what the machine can afford.
#
# With cargo's default debug = 2 the port's debug artifacts are enormous: the
# rpi binary is 213 MB, the rpi-cli rlib is 173 MB, and the 87 test binaries in
# target/debug/deps add up to 2.1 GB. Every rebuild of a crate rewrites all of
# that, and rustc's peak memory scales with the debug info it emits, so one
# build of rpi-cli can take several gigabytes of RAM on a machine that has 18
# GB and no swap. The kernel then writes back the dirty pages under memory
# pressure and the whole desktop stalls.
#
# Line tables alone keep the backtraces readable and cut the artifacts to a
# fraction of their size, which is the trade this machine needs.
[profile.dev]
debug = "line-tables-only"

# The dependencies never need our debugging information.
[profile.dev.package."*"]
debug = 0

[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"
